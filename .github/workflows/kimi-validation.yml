name: Kimi validation
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    env:
      CC_SWITCH_TEST_HOME: ${{ runner.temp }}/kimi-test-home
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Prepare and format
        shell: bash
        run: |
          mkdir -p dist
          cargo fmt --all
          git diff --binary > format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-features -- -D warnings
      - run: cargo test --locked -p tokscale-core
      - run: cargo build --locked --release -p tokscale-cli
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      - uses: actions/upload-artifact@v4
        with:
          name: tokscale-win32-test
          path: target/release/tokscale.exe
      - name: Verify committed formatting
        run: git diff --exit-code
